name: collect snow data

on:
  schedule:
    # 10:17 JST（UTC 01:17）。観測は9時だが、市サイトへの掲載時刻が未確認のため余裕をとっている。
    #
    # 分を :30 から :17 にずらしている。GitHub は「毎時0分などの混む時刻を避けて
    # 分を散らす」ことを推奨しており、その効果を見るため。
    # 2026-09-27〜10-04 の8日間、指定時刻から平均328分（5時間半）遅れて実行されていた。
    # ぶれは38分と小さく、混雑というより構造的な遅れに見える。
    # 時はあえて動かしていない。分の変更が効かなくても、着地は現状と変わらないため。
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-snow-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-collect.txt

      - name: 依存パッケージのインストール
        run: pip install -r requirements-collect.txt

      # ここでは失敗させない。失敗の記録（data/status.json）も
      # コミットしたいので、終了コードだけ持ち越して最後に判定する。
      - name: データ収集
        id: collect
        run: |
          set +e
          python collect.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "collect.py の終了コード: $code"

      - name: 変更があればコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain)" ]; then
            echo "差分なし。コミットしません。"
            exit 0
          fi
          git add -A
          git commit -m "data: update snow data ($(TZ=Asia/Tokyo date +%F))"
          git push

      - name: 収集が失敗していればジョブを失敗させる
        run: |
          code="${{ steps.collect.outputs.exit_code }}"
          if [ "$code" != "0" ]; then
            echo "collect.py が失敗しました（終了コード $code）。原因は data/status.json に記録されています。"
            exit 1
          fi
          echo "正常終了しました。"
